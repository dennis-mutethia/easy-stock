<!-- Line Chart -->
<div class="row">
    <div class="col-12 mt-3">
        <div class="p-10 text-white text-center">
            <canvas id="myChart" style="width: 200px; height: 200px"></canvas>
        </div>
    </div>
</div>
<!-- End Line Charts -->

<script>
    new Chart("myChart", {
                type: "line",
                data: {
                    labels: [{{ dates | join(',') | safe }}],
                    datasets: [
                        {
                            data: [{{ stocks | join(',') | safe }}],
                            borderColor: "#2a4e80",
                            fill: false,
                            label: 'Stock'
                        },
                        {
                            data: [{{ purchases | join(',') | safe }}],
                            borderColor: #e09400",
                            fill: false,
                            label: 'Purchases'
                        },     
                        {
                            data: [{{ sales | join(',') | safe }}],
                            borderColor: "#1b7f45",
                            fill: false,
                            label: 'Sales'
                        },                     
                        {
                            data: [{{ expenses | join(',') | safe }}],
                            borderColor: "#c0392b",
                            fill: false,
                            label: 'Expenses'
                        }
                    ]
                },
                options: {
                    legend: {
                        display: true
                    },
                    title: {
                        display: true,
                        text: "Weekly Stock vs Purchases vs Sales vs Expenses Trend"
                    }
                }
            });
</script>
